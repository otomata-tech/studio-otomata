<!--
  carte-voeux.html : carte imprimée Otomata, A6 paysage (148 × 105 mm) + 3 mm de fond perdu
  = page de 154 × 111 mm. Deux pages : recto (visuel), verso (message).
  Ne pas ouvrir tel quel : rendu par `node plaquettes/build-carte.mjs <donnees.json>`,
  qui embarque les polices et injecte le texte. Le texte vit HORS de ce dépôt public
  (il porte des noms) ; les valeurs par défaut ci-dessous ne servent qu'à l'aperçu.
-->
<style>
  /* __FONTS__ */
  :root {
    --bg: #fefcf5;
    --ink: #2c2112;
    --mute: #6c5e44;
    --hair: #dccfa8;
    --primary: #f0b41e;
    --primary-ink: #5a3b03;
    --primary-soft: #fbe7a8;
    --bleed: 3mm;
    --safe: 9mm; /* fond perdu + marge de sécurité de 6 mm côté coupe */
  }
  @page { size: 154mm 111mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { font-family: "Hanken Grotesk", sans-serif; color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .face { position: relative; width: 154mm; height: 111mm; overflow: hidden;
    background: var(--bg); page-break-after: always; break-after: page; }
  .face:last-child { page-break-after: auto; break-after: auto; }

  .display { font-family: "Bricolage Grotesque", sans-serif; font-optical-sizing: auto;
    font-variation-settings: "wdth" 90; font-weight: 600; letter-spacing: -0.025em; }
  .mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; }

  /* le mark : ombre dure, anneau saffran décalé, disque cerné d'encre (brand/logos/otomata) */
  .mark { position: absolute; }
  .mark svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* halo saffran, la « matière riso » du kit d'identité */
  .sun { position: absolute; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(240,180,30,0.30), rgba(240,180,30,0.08) 55%, transparent 72%); }

  /* ---------- recto ---------- */
  .recto .sun { width: 150mm; height: 150mm; right: -48mm; top: -52mm; }
  .recto .mark { width: 50mm; height: 50mm; right: 17mm; top: 13mm; }
  /* motif optionnel (données : "motif") — même grammaire que le mark : aplat, cerne d'encre, ombre dure */
  .recto .motif { position: absolute; display: none; }
  .recto .motif svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .recto[data-motif="olivier"] .motif { display: block; width: 74mm; height: 43mm; right: 10mm; top: 41mm; }
  .recto .titre { position: absolute; left: var(--safe); bottom: 33mm; width: 88mm;
    font-size: 25pt; line-height: 1.02; text-shadow: 0.8mm 0.8mm 0 var(--primary); }
  .recto footer { position: absolute; left: var(--safe); right: var(--safe); bottom: var(--safe);
    border-top: 0.35mm solid var(--ink); padding-top: 3mm;
    display: flex; justify-content: space-between; align-items: flex-end; }
  .recto .nom { font-size: 14pt; line-height: 1; text-shadow: 0.6mm 0.6mm 0 var(--primary); }
  .recto .base { margin-top: 1.6mm; font-size: 5.6pt; letter-spacing: 0.2em; color: var(--mute); }
  .recto .base b { color: var(--ink); font-weight: 700; }
  .recto .url { font-size: 6pt; letter-spacing: 0.16em; font-weight: 700; }

  /* ---------- verso : un panneau illustré à gauche (fond perdu compris), le message à droite ;
     sous le message, l'espace libre reçoit le mot manuscrit. Pas de lignes : sur une carte
     glissée en enveloppe, elles se lisent comme un bloc adresse. ---------- */
  .verso .panneau { position: absolute; left: 0; top: 0; bottom: 0; width: 58mm; overflow: hidden;
    background: var(--primary-soft); border-right: 0.35mm solid var(--ink); }
  .verso .panneau .mark { width: 11mm; height: 11mm; left: var(--safe); bottom: var(--safe); }
  /* scène optionnelle de la bande (données : "scene"), pleine hauteur, même grammaire que le mark */
  .verso .scene { position: absolute; inset: 0; display: none; }
  .verso .scene svg { width: 100%; height: 100%; display: block; }
  .verso[data-scene] .scene { display: block; }
  .verso[data-scene] .panneau .mark { display: none; }
  .verso .texte { position: absolute; left: 67mm; right: var(--safe); top: var(--safe); bottom: var(--safe);
    display: flex; flex-direction: column; }
  .verso .message { font-size: 9.4pt; line-height: 1.45; }
  .verso .message p + p { margin-top: 2.8mm; }
  .verso .signature { margin-top: auto; }
  .verso .signataire { font-size: 8pt; font-weight: 700; }
  .verso .signataire-url { margin-top: 1mm; font-size: 5.6pt; letter-spacing: 0.16em; color: var(--mute); }
</style>

<section class="face recto">
  <div class="sun"></div>

  <h1 class="titre display"></h1>
  <footer>
    <div>
      <div class="nom display">OTOMATA</div>
      <div class="base mono"></div>
    </div>
    <div class="url mono"></div>
  </footer>
</section>

<section class="face verso">
  <div class="panneau">
    <div class="scene"></div>
    <div class="mark"></div>
  </div>
  <div class="texte">
    <div class="message"></div>
    <div class="signature">
      <div class="signataire"></div>
      <div class="signataire-url mono"></div>
    </div>
  </div>
</section>

<!--__DATA__-->
<script>
  const D = window.__CARTE || {};
  const titre = D.titre || 'Belles fêtes<br>de fin d’année.';
  const message = D.message || ['Texte du message.', 'Un paragraphe par entrée.'];
  const signataire = D.signataire || 'OTOMATA';
  const baseline = D.baseline || '<b>Studio IA</b> &middot; <b>Marseille</b>';
  const lien = D.url || 'otomata.tech';

  const q = s => document.querySelector(s);
  const mark = q('#mark').innerHTML;
  document.querySelectorAll('.mark').forEach(el => { el.innerHTML = mark; });
  if (D.motif) {
    const t = q('#motif-' + D.motif);
    if (!t) throw new Error(`motif inconnu : ${D.motif}`);
    q('.recto').dataset.motif = D.motif;
    q('.recto .motif').innerHTML = t.innerHTML;
  }
  if (D.scene) {
    const t = q('#scene-' + D.scene);
    if (!t) throw new Error(`scène inconnue : ${D.scene}`);
    q('.verso').dataset.scene = D.scene;
    q('.verso .scene').innerHTML = t.innerHTML;
  }
  q('.titre').innerHTML = titre;
  q('.base').innerHTML = baseline;
  q('.url').textContent = lien;
  q('.message').innerHTML = message.map(p => `<p>${p}</p>`).join('');
  q('.signataire').innerHTML = signataire;
  q('.signataire-url').textContent = lien;
</script>
